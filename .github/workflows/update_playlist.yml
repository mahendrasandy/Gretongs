name: Update Playlist Custom

on:
  schedule:
    # Menjalankan otomatis setiap hari jam 00:00 UTC (07:00 WIB)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-m3u:
    runs-on: ubuntu-latest

    permissions: 
      contents: write

    steps:
      - name: Checkout Repositori
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Jalankan Skrip Python
        # Pastikan nama file sesuai dengan yang Anda simpan di repositori
        run: python update_playlist.py

      - name: Commit dan Push Perubahan
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          
          # Tambahkan file output dari skrip Python
          git add playlist_custom.m3u
          
          # Commit hanya dilakukan jika ada perubahan pada file M3U (ada URL baru atau perubahan metadata)
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update playlist custom" && git push)
